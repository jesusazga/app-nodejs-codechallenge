spring.application.name=transaction-service
server.port=8081

# DB (docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka (docker host listener)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transaction-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=pe.indigital.yape.transactionservice.adapters.in.messaging.kafka.dto.TransactionStatusUpdatedEvent

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

app.kafka.topics.transaction-created=transactions.created
app.kafka.topics.transaction-status-updated=transactions.status-updated